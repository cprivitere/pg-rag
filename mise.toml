[env]
# Portable paths - update this if mywebui moves
WEBUI_DIR = "F:/ProjectGorgon/mywebui"
# Logs directory
LOGS_DIR = "{{ config_root }}/logs"
# Model identities — SINGLE SOURCE of truth. Every consumer reads these:
#   - `mise debug-llm` (via {{ env.X }})
#   - `.mise/tasks/llm-start.ps1` (via $env:X)
#   - scripts/check_docs.py (via tomllib)
# Swap a model (ref + its tuning flags) here; nothing else should change.
# Launchers append their own host/port/-np/batch/log-file assembly.
# `mise drift` fails if any consumer hardcodes a model literal.
# Tuning rationale lives in docs/LLM_MODEL_WIRING.md — do not duplicate
# per-model prose here.
# == PRODUCTION MODEL ==

LLM_MODEL = "ornith-ai/Ornith-1.5-9B-GGUF:Q4_K_M"
LLM_FLAGS = "--no-mmproj -ngl 999 -fa on -c 65536 -ctk q8_0 -ctv q8_0 --reasoning-budget 4096"

[task_config]
# Default to PowerShell on Windows with -NoProfile (mise default)
shell = "pwsh -NoProfile -Command"
# Run tasks from project root by default
dir = "{{ config_root }}"
# Cascade to any child mise.toml files
cascade = true

[tasks.test]
description = "Run test suite"
run = "uv run -m pytest tests/"
alias = "te"

# --- Pipeline tasks ---
[tasks.sync]
description = "Fast sync: CDN data + rebuild documents + BM25 + tool corpus (skips slow wiki fetch)"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag build-documents",
  "uv run python -m pgrag.rag.bm25",
  "uv run python scripts/build_tool_corpus.py",
]
alias = "sy, rf"

[tasks."sync-full"]
description = "Full sync: CDN + wiki data + rebuild documents + BM25 + tool corpus"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag download-wiki",
  "uv run pgrag build-documents",
  "uv run python -m pgrag.rag.bm25",
  "uv run python scripts/build_tool_corpus.py",
]
alias = "syf"

[tasks."refresh-cdn"]
description = "Download CDN data to data/cdn/"
run = "uv run pgrag download-cdn"

[tasks."refresh-wiki"]
description = "Download wiki pages to data/wiki/ (slow)"
run = "uv run pgrag download-wiki"

[tasks."generate-docs"]
description = "Regenerate data/documents.json from CDN + wiki source (idempotent; stamps the generator version)"
run = "uv run pgrag build-documents"
alias = "docs"

# --- Desired-state syncs: one command converges generated docs + BM25 to current source ---
# Each runs build-documents first so BM25 is rebuilt from fresh documents.json.

[tasks."build-bm25"]
description = "Pre-warm/build the BM25 index (rebuilt + persisted when documents.json changed). Prevents the lazy first-query rebuild spike"
run = "uv run python -m pgrag.rag.bm25"
alias = "b25"

[tasks."build-tool-corpus"]
description = "Build the tool corpus index (data/tool_documents.json + data/tool_bm25.pkl) for `corpus_search --corpus tool`"
run = "uv run python scripts/build_tool_corpus.py"
alias = "btc"

[tasks."sync-wiki"]
description = "Converge wiki data to current source: regenerate documents, BM25, then the tool corpus"
run = [
  "uv run pgrag build-documents",
  "uv run python -m pgrag.rag.bm25",
  "uv run python scripts/build_tool_corpus.py",
]
alias = "syw"

[tasks."sync-cdn"]
description = "Converge CDN data to current source: fetch CDN, regenerate documents, BM25, then the tool corpus"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag build-documents",
  "uv run python -m pgrag.rag.bm25",
  "uv run python scripts/build_tool_corpus.py",
]
alias = "syc"


[tasks."sql-store"]
description = "Build data/sqlite_gorgon.db (CDN + wiki + session + glogger primary sources) for the agentic tool loop"
run = "uv run python scripts/build_sqlstore.py"
alias = "sq"

[tasks."upload-store"]
description = "Publish data/sqlite_gorgon.db to the PRIVATE HF bucket (Nubula/paddock-private) for the molab tool loop; run `mise sql-store` first to refresh it"
run = "uv run python scripts/publish_store.py"
alias = "us"

[tasks."agentic-chat"]
description = "Agentic CLI chat over the SQLite store (tool loop; needs only LLM :8080)"
run = "uv run python scripts/agentic_chat.py"
alias = "ac"

[tasks."agentic-tune"]
description = "Agentic loop tuning sweeps (temperature/reasoning/model) -> data/agentic_tune/"
run = "uv run python scripts/agentic_tune.py --eval-set cases --sweep-temperature 0,0.2,0.4,0.7 --sweep-seeds 0,1,2"
alias = "at"

[tasks.golden]
description = "Run the full golden eval set through the tool loop (LLM only). Long: every case is a multi-round reasoning generation, so batch it in the background. `mise golden-short` for the fast tier"
run = "uv run python scripts/golden_check.py"
alias = "gd"

[tasks."golden-short"]
description = "Run the short golden eval tier (8 representative cases; fast path for a change you just made; LLM only)"
run = "uv run python scripts/golden_check.py --tier short"
alias = "gds"

[tasks."golden-one"]
description = "Rerun named golden case(s) for quick verification: `mise golden-one fireball-ability` (comma-separated ids allowed; appends to data/golden/history.jsonl)"
usage = 'arg "<ids>" var=#true help="Golden case id(s), comma-separated"'
run = "uv run python scripts/golden_rerun.py --id {{ usage.ids | join(sep=',') }}"
alias = "go"

[tasks."golden-type"]
description = "Run golden subset by type: `mise golden-type recipe` or `mise golden-type entity recipe` (LLM only)"
usage = 'arg "<types>" var=#true help="Golden type(s): entity|recipe|comparison|general"'
run = '''
foreach ($t in @('{{ usage.types | join(sep='\',\'') }}')) {
  uv run python scripts/golden_rerun.py --selection all --type "$t"
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
}
'''
alias = "gt"

[tasks."golden-flaky"]
description = "Focus on historically troublesome golden cases (>50% recent miss-rate via history.jsonl, plus manual data/golden/FLAKY.txt). Records accrue on every golden run"
run = "uv run python scripts/golden_rerun.py --selection flaky"
alias = "gf"

[tasks."golden-flaky-list"]
description = "Audit golden miss statistics per id (recent-miss%% over the last 10 records; no classification runs)"
run = "uv run python scripts/golden_rerun.py --selection list"
alias = "gfl"

# --- LLM server ---

[tasks."debug-llm"]
description = "Start LLM server in foreground (debug)"
run = "llama-server -hf {{ env.LLM_MODEL }} {{ env.LLM_FLAGS }} --host 0.0.0.0 --port 8080"
alias = "dsl"

[tasks."llm-pick"]
description = "Pick the default LLM model from tested candidates"
run = "uv run python scripts/llm_pick.py"
alias = "lp"

# --- Open WebUI ---

[tasks."debug-webui"]
description = "Start Open WebUI in foreground (debug)"
run = "uv run --directory '{{ env.WEBUI_DIR }}' open-webui serve --port 3000"
dir = "{{ env.WEBUI_DIR }}"
alias = "dsw"

# --- Gradio chat ---

[tasks.chat]
description = "Run Gradio chat UI (refreshes the store at startup; requires the LLM service up). Port 7860"
run = "uv run --with gradio python scripts/rag_chat.py"
alias = "chat"

# --- All services (background via file tasks in .mise/tasks/) ---

[tasks."start-all"]
description = "Start all services (llm + chat) with logging"
depends = ["llm-start", "chat-start"]
alias = "start"

[tasks."stop-all"]
description = "Stop all services (llm + chat)"
depends = ["chat-stop", "llm-stop"]
alias = "down"

# --- Status check ---

[tasks.status]
description = "Check status of all services (llm, chat)"
run = "uv run python scripts/check_services.py"
alias = "st"

[tasks.drift]
description = "Check docs/skills against the repo: pointers resolve, contract constants match, TEST_CONTRACTS covers every test, golden counts are real"
run = "uv run python scripts/check_docs.py"
alias = "dr"


# --- Log viewing ---

[tasks.logs]
description = "List all log files in logs directory"
run = "Get-ChildItem '{{ env.LOGS_DIR }}' -ErrorAction SilentlyContinue | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize"

[tasks."tail-llm"]
description = "Tail LLM server log (live, last 20 lines)"
run = "Get-Content '{{ env.LOGS_DIR }}/llm.log' -ErrorAction SilentlyContinue -Wait -Tail 20"
alias = "tll"

[tasks."tail-webui"]
description = "Tail Open WebUI log (live, last 20 lines)"
run = "Get-Content '{{ env.LOGS_DIR }}/webui.log' -ErrorAction SilentlyContinue -Wait -Tail 20"
alias = "tlw"

# --- Lint / format ---

[tasks.lint]
description = "Ruff check: static analysis of src/, scripts/, tests/ (fails on regression)"
run = "uv run ruff check src scripts tests"
alias = "li"

[tasks.fmt]
description = "Ruff format + safe autofix (import sort, unused imports, f-strings)"
run = [
  "uv run ruff format src scripts tests",
  "uv run ruff check src scripts tests --fix",
]
alias = "fo"

[tools]
python = "3.15"
ruff = "latest"
