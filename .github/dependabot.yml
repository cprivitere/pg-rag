version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[actions] "
  # uv ecosystem parked until Dependabot's updater image supports Python 3.15
  # (tool_version_not_supported: detected >=3.15, image tops out at 3.14).
