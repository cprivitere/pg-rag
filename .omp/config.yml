# Project-scoped oh-my-pi settings for pg-rag.
#
# Deliberately lean (no swarm, no MCP servers, no model-role duplication):
# global config at ~/.omp/agent/config.yml owns credentials and model roles
# (default = DeepSeek-V4-Flash:max; advisor model resolved from global modelRoles.advisor).
# This file only changes what this repo needs.

# Second model reviews each completed turn against .omp/WATCHDOG.md's
# RAG-architecture checklist and can flag regressions (duplicate retrieval
# paths, full-corpus rebuilds, metadata drift, missing regression tests).
advisor:
  enabled: true