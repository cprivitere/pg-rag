# Ruff configuration — the repo linter. Single source: this file.
# Run: `mise lint` (check), `mise format` (format), or `uv run ruff check . --fix`.
# `tests/test_lint.py` gates this config: `mise test` fails on regressions.
# LLM artifacts and generated files are excluded — never hand-lint those.
line-length = 100

# Style floor: parenthesized `except (A, B):` everywhere. The repo targets
# Python >=3.15 (which also accepts PEP 758 `except A, B:`), but the
# parenthesized form parses on every 3.x and `ruff format` must not churn
# handler syntax between editors — so the target stays pinned below the floor.
target-version = "py313"

extend-exclude = ["data", ".tmp", ".venv", "logs", ".ruff_cache", ".pytest_cache"]      # LLM artifacts + gitignored build outputs

[format]
quote-style = "double"      # repo dominant already
indent-style = "space"

[lint]
# Defaults (E4,E7,E9,F): bugbear-level correctness only.
# Added: I (import sort), RUF (ruff-specific), SIM (simplify), UP (modernize),
#        B (bugbear strict), W, ISC (string concat), FLY (join perf).
# Deliberately OFF: E501 (line length — formatter's job), ANN (typer/annotating),
#        N (naming), D (docstrings), S (bandit), DTZ, RET, PERF, FURB, C4, PIE.
select = ["E4", "E7", "E9", "F", "I", "W", "B", "UP", "SIM", "ISC", "FLY", "RUF"]

# scripts/ runs as one-off host tooling — pragmatic exemptions.
# Only codes `select` actually carries may be listed: the S/BLE/PLW/DTZ families
# are deliberately off (above), so ignoring them suppressed nothing and merely
# looked like a safeguard. `scripts/check_docs.py` asserts every suppression
# names a selected rule, which keeps this list honest as `select` changes.
[lint.per-file-ignores]
"scripts/**" = ["RUF059", "F841"]   # unused unpack/vars in probe scripts
# tests use bare asserts and unpack what they assert on
"tests/**" = ["RUF059"]

[lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = false
